name: Build and publish container image

# Builds the production image (see ./Dockerfile - not Dockerfile.dev,
# which is only for the long-lived local dev container) and pushes it to
# GitHub Container Registry so it can be pulled straight onto UnRAID.
#
# Runs on every push to main that touches something the image actually
# depends on, plus workflow_dispatch for an on-demand rebuild (e.g. after
# changing package visibility, or just to confirm the pipeline works).
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "app/**"
      - "static/**"
      - "templates/**"
      - "requirements.txt"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
